[package]
name = "beeper"
version = "0.1.3"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description.workspace = true
categories.workspace = true

[features]
default = ["h1", "h2"]
build = []
h1 = []
h2 = []

[dependencies]
as-bytes = "0.2.0"
bytes = "1.12.1"
http = "1.5.0"
httlib-huffman = "0.3.4"
libc = "0.2.189"
plain = "0.2.3"
tracing = "0.1.44"
xbpf = "0.0.4"

[build-dependencies]
xbpf = { version = "0.0.4", features = ["build"] }

[dev-dependencies]
reqwest = "0.13.4"
tokio = { version = "1.53", features = ["full"] }
utils = { path = "../utils" }
h2 = "0.4.16"
